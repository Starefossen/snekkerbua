[tools]
python = "3.11"

# Snekkerbua har flere prosjekter, men bare én oppgavefil - den ligger her, på
# rota, slik at `mise run build` fortsatt er `mise run build` uansett hvor i
# treet du står. Hver oppgave kjøres i prosjektkatalogen sin, så alle stiene
# under er de samme relative stiene de alltid har vært (docs/, tools/,
# parts.tsv). Kommer prosjekt nummer to, får det sine egne oppgaver her med
# `dir` satt på oppgaven - eller en egen mise.toml i prosjektet sitt.
[task_config]
dir = "{{config_root}}/prosjekter/hanna"

[tasks.install]
description = "Install Python dependencies"
run = "pip install -r requirements.txt"

[tasks.build-alcove]
description = "Generate the alcove bed frame model (.step, .svg)"
run = "python v1/generate_bed_frame.py"
depends = ["install"]

[tasks.build]
description = "Generate the loft bed model, both modes, and the documentation fragments in docs/generated/"
# tools/gen_doc_tables.py imports generate_loftbed.py, so the model is built,
# validated and exported exactly once - and then every number the docs quote
# is emitted off it. Running `python generate_loftbed.py` on its own still
# works and just skips the documentation.
run = "python tools/gen_doc_tables.py"
depends = ["install"]

[tasks.build-full]
description = "Same as build plus the slow deliverables (.glb and the hidden-line .svg projections) - run once at the end"
run = "LOFTBED_FULL=1 python tools/gen_doc_tables.py"
depends = ["install"]

[tasks.montering]
description = "Draw the line art for docs/MONTERING.md - one per build step plus the cover (needs rsvg-convert for the PNGs)"
depends = ["build"]
run = "python tools/render_lineart.py --width 1600"

[tasks.pdf]
description = "Sett sammen den trykkeklare PDF-en (docs/hanna.pdf) av MONTERING, ASSEMBLY, tabellene og tegningene - med sideforhandsvisninger i docs/preview/"
# Bruker de innsjekkede dokumentene som de er, sa den gar uten build123d.
# Trenger python-markdown (requirements.txt) og en Chrome/Chromium a printe med.
run = "python tools/build_pdf.py"
depends = ["install"]

[tasks.poster]
description = "Tegn repoets sosiale forhåndsvisning - GitHubs og:image (docs/img/hanna-poster.png, 1280×640, pluss @2x)"
# Samme forside som PDF-en, lagt ned på siden: teksten leses ut av den
# innsjekkede docs/MONTERING.md og tegningen er hanna-hero.svg brukt som
# vektor, så oppgaven trenger verken build123d eller Chrome - bare Python og
# rsvg-convert. Bildet lastes opp under Settings -> Social preview.
run = "python tools/render_poster.py"

[tasks.manualsider]
description = "Kontaktark av manualen - de ni første sidene i docs/hanna.pdf side ved side (docs/img/hanna-manual-sider.png, 3x3)"
# Leser den ferdige PDF-en med poppler og setter sidene sammen med Pillow -
# den bygger den ikke. PDF-en koster en Chrome-runde, og dette er en avlesning
# av den, ikke en ny kilde: kjør `mise run pdf` først, ellers sier oppgaven fra.
run = "python tools/render_pdf_matrix.py"

[tasks.check]
description = "Determinismesjekk: kjør hele kjeden to ganger og krev byte-identiske artefakter"
# Alt i docs/generated/, docs/MONTERING.md, docs/img/ og parts.tsv er utledet
# av modellen, og det er sjekket inn nettopp for at en diff skal vise hva en
# endring i modellen gjorde med tegningene. De fire figurikonene i
# docs/icons/hanna/ og landemerketabellene i docs/PRAKSIS.md §4 er utledet av
# den samme slags kilde - landemerketabellen i tools/gen_figurhode.py - og
# hasjes derfor sammen med resten. De tolv andre ikonene i katalogen er tegnet,
# ikke regnet; de er med fordi katalogen er med, og de skal ikke endre seg.
# De tre genererte skjemaarkene - setedetalj, end-elevation og spikerslag -
# er med av samme grunn som resten.
#
# Alt dette er sjekket inn for at en diff skal vise hva en endring i modellen
# gjorde med tegningene, og den avlesningen er verdiløs hvis
# kjeden selv kan gi to svar på samme spørsmål, så dette er den asserten:
# kjør den to ganger og krev samme bytes. Ryker den, er det en usortert dict,
# en tidsstempel eller en id()-sortering et sted - ikke en modellendring.
#
# HVORFOR `usdz` IKKE ER MED I DENNE KJEDEN. Den ble glemt i en runde og
# oppdaget først da noen åpnet modellen i Quick Look, så spørsmålet er stilt og
# svaret skrives ned her: `check` er en determinismesjekk på de INNSJEKKEDE
# artefaktene, og .usdz-filene er i .gitignore - det er ingenting å
# diff-e dem mot. Dessuten trenger `usdz` swift, usdcat, usdzip og usdchecker,
# altså macOS med USD-verktøyene installert, mens `check` skal kunne kjøres av
# hvem som helst med Python. Den hører derfor hjemme i RUNDENS port, ikke i
# denne: `mise run build && montering && check && pdf && usdz`, og usdz er den
# eneste av dem som faktisk validerer eksporten (usdchecker --arkit).
run = """
set -e
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
snap() {
  git ls-files -z -- docs/generated docs/MONTERING.md docs/img parts.tsv \\
                     docs/schematics/setedetalj.svg \\
                     docs/schematics/end-elevation.svg \\
                     docs/schematics/spikerslag.svg \\
                     docs/icons/hanna docs/PRAKSIS.md \\
    | xargs -0 shasum -a 256
}
for pass in 1 2; do
  python tools/gen_doc_tables.py > "$work/build-$pass.log" 2>&1 \\
    || { cat "$work/build-$pass.log"; exit 1; }
  python tools/render_lineart.py --width 1600 > "$work/draw-$pass.log" 2>&1 \\
    || { cat "$work/draw-$pass.log"; exit 1; }
  python tools/render_setedetalj.py > "$work/sete-$pass.log" 2>&1 \\
    || { cat "$work/sete-$pass.log"; exit 1; }
  python tools/render_endelevation.py > "$work/kort-$pass.log" 2>&1 \\
    || { cat "$work/kort-$pass.log"; exit 1; }
  python tools/render_spikerslag.py > "$work/spik-$pass.log" 2>&1 \\
    || { cat "$work/spik-$pass.log"; exit 1; }
  snap > "$work/sum-$pass"
done
if ! diff -u "$work/sum-1" "$work/sum-2" > "$work/delta"; then
  echo "IKKE DETERMINISTISK - to like kjøringer ga ulike artefakter:"
  cat "$work/delta"
  exit 1
fi
echo "OK  $(wc -l < "$work/sum-1" | tr -d ' ') artefakter byte-identiske over to fulle kjøringer"
# Filmene er utledet av den samme modellen, men de rendres ikke her - de er
# for dyre. Det som ER gratis er å spørre om de er bygget av DENNE modellen,
# og det spørsmålet hører hjemme i samme port: en innsjekket film som viser en
# eldre seng er akkurat den slags stille avviket resten av kjeden er bygget
# for å hindre. Hashing, ingen rendring, millisekunder.
python tools/render_animasjon.py --check
"""
depends = ["install"]

[tasks.setedetalj]
description = "Detaljark for skråskruesetene: snitt langs skrueaksen, munningen ovenfra, vinkelklossen og bruken av den (docs/schematics/setedetalj.svg)"
# Tre av arkene i docs/schematics/ er generert av modellen - dette,
# end-elevation og spikerslag - og derfor er de med i `check`. De fire andre
# er tegnet for hånd og har ingenting å regenereres mot.
depends = ["build"]
run = "python tools/render_setedetalj.py"

[tasks.endelevation]
description = "Kortsnittet: sengen sett fra enden, snitt A-A i Y-Z gjennom endebjelken (docs/schematics/end-elevation.svg)"
# Det eneste arket som viser sengens DYBDE i sin helhet, og det som sier at
# den er asymmetrisk: 1402 mot veggen, 2037 mot rommet (v14/X1 - var 1065
# og 1700).
depends = ["build"]
run = "python tools/render_endelevation.py"

[tasks.spikerslag]
description = "Bakveggen som oppriss: sonene som skal ha spikerslag, malt fra ferdig gulv (docs/schematics/spikerslag.svg)"
# Det eneste arket som ikke tegner sengen, men VEGGEN. Sonene er modellens
# WALL_ZONES, og arket leses av byggmesteren for veggen lukkes - etterpa
# kommer han ikke til.
depends = ["build"]
run = "python tools/render_spikerslag.py"

[tasks.figurhode]
description = "Regn hodet på konturfiguren inn i de fire figurikonene og skriv landemerketabellene i PRAKSIS §4 (tools/gen_figurhode.py)"
# `mise run build` gjør det samme underveis - denne er for den som holder på
# med selve hodet og vil se det uten å bygge modellen. `--check` skriver
# ingenting og feller hvis en ikonfil er rørt for hånd.
run = "python tools/gen_figurhode.py"

[tasks.mekanisme]
description = "Bevisark for platemekanismen: de to hjørnene i begge stillinger, og de tre låsevalgene (docs/preview/)"
depends = ["build"]
run = "python tools/render_mekanisme.py"

[tasks.montering-skyggelagt]
description = "The shaded USD renders of the same steps, for reference (macOS: usdrecord + swift)"
depends = ["build"]
run = "python tools/render_steps.py --width 1400"

[tasks.film]
description = "Alle tre filmene (docs/img/hanna-*.gif): dreieskive, mekanisme og oppbygging"
depends = ["build"]
run = "python tools/render_animasjon.py all"

[tasks.film-turntable]
description = "Bare dreieskiva - den ferdige sengen 360 grader (docs/img/hanna-turntable.gif)"
depends = ["build"]
run = "python tools/render_animasjon.py turntable"

[tasks.film-mekanisme]
description = "Bare mekanismefilmen - platen fra sengesete til bordsete, med kollisjonsprøve på hver frame"
depends = ["build"]
run = "python tools/render_animasjon.py mekanisme"

[tasks.film-bygg]
description = "Bare oppbyggingsfilmen - steg 1-11 fra byggesteg.json (den dyre, kjør den alene når stegdata endres)"
depends = ["build"]
run = "python tools/render_animasjon.py bygg"

[tasks.film-check]
description = "Er filmene bygget fra DENNE modellen? Hasher parts.tsv og byggesteg.json mot docs/img/hanna-filmer.stamp - tar millisekunder, rendrer ingenting"
run = "python tools/render_animasjon.py --check"

[tasks.schematics]
description = "Render docs/schematics/*.svg to PNG for proofreading"
run = """
set -e
mkdir -p /tmp/loftbed_schematics
for f in docs/schematics/*.svg; do
  rsvg-convert -w 1600 "$f" -o "/tmp/loftbed_schematics/$(basename "${f%.svg}").png"
done
ls -l /tmp/loftbed_schematics
"""

[tasks.usdz]
description = "Convert the generated meshes to .usdz (Xcode / Quick Look), one material per colour group"
depends = ["build"]
run = """
set -e
out="$PWD"
groups="${LOFTBED_GROUP_DIR:-${TMPDIR:-/tmp}/loftbed_groups}"
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
for mode in bed_mode table_mode; do
  # One line per colour group: <name>=<r,g,b,a>=<per-group .stl>, written by
  # generate_loftbed.py into a scratch dir (never the repo).
  swift tools/mesh_to_usda.swift "$work/loftbed_$mode.usda" $(cat "$groups/loftbed_$mode.groups")
  usdcat -o "$work/loftbed_$mode.usdc" "$work/loftbed_$mode.usda"
  rm -f "$out/loftbed_$mode.usdz"
  (cd "$work" && usdzip "$out/loftbed_$mode.usdz" "loftbed_$mode.usdc")
  # usdchecker validerer, den produserer ikke. Mangler den, er .usdz-filene
  # like riktige - de er bare ikke kontrollert mot ARKit-profilen, og da skal
  # det stå her og ikke oppdages senere.
  if command -v usdchecker > /dev/null 2>&1; then
    usdchecker "$out/loftbed_$mode.usdz" --arkit
  else
    echo "ADVARSEL: usdchecker mangler - loftbed_$mode.usdz er bygget, men IKKE validert mot --arkit."
  fi
done
ls -l "$out"/loftbed_*.usdz
"""

[tasks.render]
description = "Shaded 3/4-view PNG previews of both modes via usdrecord"
depends = ["usdz"]
run = """
set -e
out="$PWD"
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
for mode in bed_mode table_mode; do
  python tools/make_render_stage.py "$out/loftbed_$mode.usdz" "$work/render_$mode.usda"
  usdrecord --camera Cam --imageWidth 1600 --complexity high \\
            --colorCorrectionMode sRGB \\
            "$work/render_$mode.usda" "$out/loftbed_$mode.png"
done
ls -l "$out"/loftbed_*.png
"""

[tasks.render-validate]
description = "The five design-validation renders (2 iso + back iso + front/end elevation), 1800 px"
depends = ["usdz"]
run = """
set -e
out="$PWD"
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
# name mode azimuth elevation distance
# Azimuth is measured from +Z towards +X. The export bakes a Z-up -> Y-up turn
# plus 180 deg about the vertical axis, so the FRONT of the bed (the ladder
# side, bed Y 800+ after v8/D12) faces +Z - the direction a default viewer
# looks from. az 0 therefore looks the ladder straight in the face, az 180 is
# the back-wall side and az 270 is the X = 1990 end. At az 0 the front guard
# rails show the climb-through gap with the ladder in it (v8/D13: 320 mm), at
# az 180 the two back boards run unbroken wall to wall.
# (These are the pre-flip azimuths 150/30/150/180/90 plus 180 deg; the flip is
# a rotation, not a mirror, so the framing is byte-for-byte the same.)
for view in \\
  "bed_iso_front bed_mode 330 24 4.5" \\
  "bed_iso_back bed_mode 210 24 4.5" \\
  "table_iso_front table_mode 330 24 4.5" \\
  "front_elev bed_mode 0 2 4.4" \\
  "end_elev bed_mode 270 2 3.4" ; do
  set -- $view
  python tools/make_render_stage.py "$out/loftbed_$2.usdz" "$work/$1.usda" "$3" "$4" "$5"
  usdrecord --camera Cam --imageWidth 1800 --complexity high \\
            --colorCorrectionMode sRGB \\
            "$work/$1.usda" "$out/loftbed_validate_$1.png"
done
ls -l "$out"/loftbed_validate_*.png
"""

[tasks.view]
description = "Preview the generated 3D model in FreeCAD"
run = "open -a FreeCAD loftbed_bed_mode.step"
depends = ["build"]

[tasks.view-usdz]
description = "Open the .usdz model in Quick Look"
run = "open loftbed_bed_mode.usdz"
depends = ["usdz"]
