  <text x="105" y="67.4" class="nm2" text-anchor="start">48×68 × 229 · innersiden · ⌀18</text>
  <text x="23" y="136" class="sect" text-anchor="start">PAPIRET GIR INNGANGSPUNKTET; VINKELEN GIR VINKELKLOSSEN.</text>
  <text x="23" y="139.8" class="note" text-anchor="start">J8-B 25° · sete ⌀18 forstner 20 mm NED LANGS SKRUENS AKSE — ikke ned i treet. Munningen blir da en ellipse 42,6 × 18 mm, som er 18/sin(25°) lang, og det er</text>
  <text x="23" y="142.4" class="note" text-anchor="start">ellipsen du merker opp etter.</text>
  <text x="23" y="146" class="note" text-anchor="start">J10 30° · sete ⌀18 forstner 18 mm NED LANGS SKRUENS AKSE — ikke ned i treet. Munningen blir da en ellipse 36 × 18 mm, som er 18/sin(30°) lang, og det er ellipsen</text>
  <text x="23" y="148.6" class="note" text-anchor="start">du merker opp etter.</text>
  <text x="23" y="152.2" class="note" text-anchor="start">Prikk SENTERET i ellipsen med syl. Det er det punktet vinkelklossens ⌀18-hull skal stå rett over — papiret gir inngangspunktet, klossen gir vinkelen, og de to er</text>
  <text x="23" y="154.8" class="note" text-anchor="start">to forskjellige verktøy.</text>
  <text x="23" y="158.4" class="note" text-anchor="start">Ellipsen selv står der for at du skal se hvor lite ved som blir igjen ut mot enden: blir munningen på treet KORTERE enn den på papiret, sto vinkelklossen for</text>
  <text x="23" y="161" class="note" text-anchor="start">bratt og skruen går for flatt.</text>
  <text x="23" y="164.6" class="note" text-anchor="start">Klossen, snittet langs skrueaksen og de to dekningsmålene står på docs/schematics/setedetalj.svg i referanseheftet. Dette arket er bare inngangspunktet.</text>
  <text x="23" y="168.2" class="note" text-anchor="start">Flatene: baksiden = mot veggen · forsiden = mot rommet · yttersiden = mot nærmeste endevegg · innersiden = mot sengas midte · over-/undersiden er delen slik den</text>
  <text x="23" y="170.8" class="note" text-anchor="start">står ferdig.</text>
  <text x="23" y="196" class="sect" text-anchor="start">SLIK BRUKES ET MØNSTER</text>
  <text x="23" y="199.6" class="note" text-anchor="start">1 Klipp langs den TYKKE linjen — kniv mot ståltlinjal, aldri saks.</text>
  <text x="23" y="202.2" class="note" text-anchor="start">2 Brett langs den stiplede og hekt brettet over kanten på delen.</text>
  <text x="23" y="204.8" class="note" text-anchor="start">3 Legg klippekanten mot delens ende. Teip over hvert hull.</text>
  <text x="23" y="207.4" class="note" text-anchor="start">4 Kontrollér det fete kontrollmålet med stålmål før du prikker.</text>
  <text x="23" y="210" class="note" text-anchor="start">5 Prikk med syl gjennom ringen — ringen sentrerer, et kryss ikke.</text>
  <text x="23" y="212.6" class="note" text-anchor="start">6 TA AV PAPIRET, og bor på prikken. Papir under boret river seg.</text>
  <text x="109" y="199.6" class="note" text-anchor="start">Hvert mål på arket er lest ut av generate_loftbed.py (FASTENER_PLACEMENTS). Tegnet</text>
  <text x="109" y="202.2" class="note" text-anchor="start">av tools/render_boresjablong.py → docs/schematics/boresjablong-skraaskrue.svg —</text>
  <text x="109" y="204.8" class="note" text-anchor="start">rediger ikke for hånd.</text>
</svg>
