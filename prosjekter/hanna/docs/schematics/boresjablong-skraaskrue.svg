  <text x="23" y="15.5" class="head" text-anchor="start">1:1 — DETTE ARKET ER ET MÅL</text>
  <text x="23" y="20" class="sect" text-anchor="start">ARK 2 · SKRÅSKRUENE — munningene i full størrelse</text>
  <text x="23" y="24.8" class="body" text-anchor="start">Skriv ut på A4 i 100 % — i Acrobat «Faktisk størrelse»; slå AV «Tilpass» og «Krymp til utskriftsområde». ENKELTSIDIG: arket skal klippes opp.</text>
  <text x="23" y="28" class="body" text-anchor="start">MÅL BEGGE LINJALENE MED STÅLMÅL FØR DU KLIPPER — en skriver kan treffe den ene retningen og bomme den andre. Avvik over 1 mm på én av dem:</text>
  <text x="23" y="31.2" class="body" text-anchor="start">kast arket. Den loddrette er 250 mm: 0,4 % matretningsfeil viser seg der som 1 mm. Den vannrette er 190 mm — det lengste et A4 kan bære.</text>
