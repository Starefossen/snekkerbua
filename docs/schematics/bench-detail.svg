<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -300 2180 1360" width="1350">
  <title>Loftseng - benkedetalj (bench detail)</title>
  <desc>Skala 2:1. Alle malsettinger er virkelige mm.</desc>
  <defs>
    <marker id="aE" markerWidth="14" markerHeight="10" refX="11" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 z" fill="#000"/></marker>
    <marker id="aS" markerWidth="14" markerHeight="10" refX="0" refY="4" orient="auto"><path d="M11,0 L0,4 L11,8 z" fill="#000"/></marker>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.1" fill="#000"/></pattern>
    <pattern id="wh" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#000" stroke-width="1.6"/></pattern>
  </defs>
  <style>
    .p  { fill:#fff; stroke:#000; stroke-width:2.6; }
    .pc { fill:url(#grain); stroke:#000; stroke-width:2.6; }
    .hid{ fill:none; stroke:#000; stroke-width:1.3; stroke-dasharray:9 6; }
    .gho{ fill:none; stroke:#000; stroke-width:1.3; stroke-dasharray:3 5; }
    .dim{ fill:none; stroke:#000; stroke-width:1.1; }
    .ext{ fill:none; stroke:#000; stroke-width:0.8; }
    .scr{ fill:none; stroke:#000; stroke-width:2.4; }
    .brk{ fill:none; stroke:#000; stroke-width:5; }
    text{ font-family:Helvetica,Arial,sans-serif; font-size:22px; fill:#000; }
    .ttl{ font-size:38px; font-weight:bold; }
    .sub{ font-size:23px; }
    .pnl{ font-size:26px; font-weight:bold; }
    .sml{ font-size:19px; }
    .dm { font-size:21px; }
  </style>

  <text class="ttl" x="1000" y="-180" text-anchor="middle">BENKEDETALJ - vange mot stolpe og vange pa stubbefot</text>
  <text class="sub" x="1000" y="-144" text-anchor="middle">Tegnet 2:1. Alle malsettinger er virkelige mm. Bakre benk vist; fremre er speilvendt.</text>

  <!-- ============================================================ -->
  <!-- PANEL A : front view at the corner post (2x, lx=2X, ly=2(320-Z)) -->
  <!-- ============================================================ -->
  <g transform="translate(40,60)">
    <text class="pnl" x="0" y="-90">A  OPPRISS VED HJORNESTOLPE (X-Z)</text>
    <rect x="-40" y="-20" width="40" height="680" fill="url(#wh)" stroke="#000" stroke-width="2.2"/>
    <text class="sml" x="-50" y="-34" text-anchor="end">VEGG X 0</text>

    <!-- post -->
    <rect class="p" x="0" y="-20" width="146" height="680"/>
    <text class="sml" x="73" y="500" text-anchor="middle" transform="rotate(-90 73 500)">HJORNESTOLPE 48x73</text>
    <!-- bench rail 48x73, Z 186..259 -->
    <rect class="pc" x="0" y="122" width="440" height="146"/>
    <text class="sml" x="230" y="204">BENKEVANGE 48x73</text>
    <!-- bearing block J9-B, Z 138..186 -->
    <rect class="pc" x="0" y="268" width="146" height="96"/>
    <!-- bench slats Z 259..280 -->
    <rect class="p" x="0"   y="54" width="190" height="68"/>
    <rect class="p" x="276" y="54" width="164" height="68"/>
    <text class="sml" x="230" y="40">BENKESPILER 34x98 (topp Z 293)</text>

    <!-- bolt J9 at X 36, Z 222 -->
    <g class="scr">
      <circle cx="72" cy="196" r="14" fill="none"/>
      <line x1="42" y1="196" x2="102" y2="196"/>
      <line x1="72" y1="166" x2="72" y2="226"/>
    </g>
    <!-- block screws X 15/36/57, Z 162 -->
    <g class="scr">
      <line x1="30"  y1="316" x2="30"  y2="316"/>
      <circle cx="30"  cy="316" r="6" fill="#000"/>
      <circle cx="72"  cy="316" r="6" fill="#000"/>
      <circle cx="114" cy="316" r="6" fill="#000"/>
    </g>

    <line class="ext" x1="102" y1="196" x2="330" y2="440"/>
    <text class="sml" x="336" y="452">J9: 1x M8x120 laaseskrue</text>
    <text class="sml" x="336" y="476">X 36, Z 222 - hull 8,5 x 96 mm</text>
    <text class="sml" x="336" y="500">hodet pa stolpens utside (Y -96)</text>
    <line class="ext" x1="114" y1="330" x2="330" y2="560"/>
    <text class="sml" x="336" y="572">J9-B BAEREKLOSS 36x48, L=73</text>
    <text class="sml" x="336" y="596">Z 138..186, 3x treskrue 5x70</text>
    <text class="sml" x="336" y="620">(X 15 / 36 / 57, Z 162)</text>

    <!-- dims -->
    <g class="ext">
      <line x1="0"   y1="122" x2="-90" y2="122"/>
      <line x1="0"   y1="196" x2="-90" y2="196"/>
      <line x1="0"   y1="268" x2="-90" y2="268"/>
      <line x1="0"   y1="364" x2="-90" y2="364"/>
      <line x1="0"   y1="54"  x2="-90" y2="54"/>
    </g>
    <g class="dim">
      <line x1="-74" y1="122" x2="-74" y2="196" marker-start="url(#aS)" marker-end="url(#aE)"/>
      <line x1="-74" y1="196" x2="-74" y2="268" marker-start="url(#aS)" marker-end="url(#aE)"/>
    </g>
    <g class="dm" text-anchor="end">
      <text x="-100" y="60">Z 293</text>
      <text x="-100" y="128">Z 259</text>
      <text x="-100" y="166">36</text>
      <text x="-100" y="240">37</text>
      <text x="-100" y="274">Z 186</text>
      <text x="-100" y="370">Z 138</text>
    </g>
    <g class="ext"><line x1="0" y1="660" x2="0" y2="720"/><line x1="72" y1="230" x2="72" y2="720"/><line x1="146" y1="660" x2="146" y2="720"/></g>
    <g class="dim"><line x1="0" y1="704" x2="72" y2="704" marker-end="url(#aE)"/><line x1="72" y1="704" x2="146" y2="704" marker-start="url(#aS)"/></g>
    <g class="dm" text-anchor="middle"><text x="36" y="694">36</text><text x="110" y="694">37</text></g>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL B : front view at the stub leg -->
  <!-- ============================================================ -->
  <g transform="translate(720,60)">
    <text class="pnl" x="0" y="-90">B  OPPRISS VED STUBBEFOT (X-Z)</text>
    <!-- continuous bench rail 48x73 x 1984 -->
    <rect class="pc" x="0" y="122" width="290" height="146"/>
    <rect class="pc" x="290" y="122" width="290" height="146"/>
    <text class="sml" x="430" y="204" text-anchor="middle">gjennomgaende 1984</text>
    <!-- stub leg X 572..645, Z 0..186 -->
    <rect class="p" x="144" y="268" width="146" height="392"/>
    <text class="sml" x="217" y="560" text-anchor="middle" transform="rotate(-90 217 560)">STUBBEFOT 48x73</text>
    <!-- slats -->
    <rect class="p" x="0"   y="54" width="100" height="68"/>
    <rect class="p" x="180" y="54" width="190" height="68"/>
    <!-- floor -->
    <line x1="-60" y1="660" x2="620" y2="660" stroke="#000" stroke-width="3.2"/>
    <rect x="-60" y="660" width="680" height="24" fill="url(#wh)" stroke="none"/>
    <text class="sml" x="628" y="656">GULV Z 0</text>
    <!-- angle bracket (behind the rail/leg, on the inner face) -->
    <path class="brk" d="M 330 258 L 158 258 L 158 440" stroke-dasharray="12 8"/>
    <circle cx="270" cy="258" r="6" fill="#000"/><circle cx="200" cy="258" r="6" fill="#000"/>
    <circle cx="158" cy="330" r="6" fill="#000"/><circle cx="158" cy="400" r="6" fill="#000"/>
    <line class="ext" x1="300" y1="258" x2="380" y2="420"/>
    <text class="sml" x="386" y="404">J10: VINKELBESLAG 90x90x65</text>
    <text class="sml" x="386" y="428">pa innerflaten (Y 0), 4x treskrue 5x40</text>
    <!-- skew screws -->
    <g class="scr">
      <line x1="176" y1="122" x2="236" y2="360"/><line x1="170" y1="122" x2="182" y2="122"/>
      <line x1="262" y1="122" x2="202" y2="360"/><line x1="256" y1="122" x2="268" y2="122"/>
    </g>
    <line class="ext" x1="240" y1="330" x2="380" y2="520"/>
    <text class="sml" x="386" y="512">2x treskrue 6x120 skraskrudd (ca. 30 gr.)</text>
    <text class="sml" x="386" y="536">gjennom vangen ned i fotens endeved</text>
    <text class="sml" x="386" y="576">Vangen HVILER pa foten:</text>
    <text class="sml" x="386" y="600">48 x 73 = 3504 mm2 = 8,1 kN</text>
    <g class="ext"><line x1="144" y1="660" x2="144" y2="740"/><line x1="290" y1="660" x2="290" y2="740"/></g>
    <g class="dim"><line x1="144" y1="726" x2="290" y2="726" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
    <text class="dm" x="217" y="762" text-anchor="middle">73</text>
    <g class="ext"><line x1="290" y1="268" x2="360" y2="268"/><line x1="290" y1="660" x2="360" y2="660"/></g>
    <g class="dim"><line x1="344" y1="268" x2="344" y2="660" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
    <text class="dm" x="354" y="470">186</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL C : Y-Z section at the post -->
  <!-- ============================================================ -->
  <g transform="translate(1560,60)">
    <text class="pnl" x="-40" y="-180">C  SNITT (Y-Z) VED STOLPE</text>
    <!-- post Y -96..-48 -->
    <rect class="p" x="48" y="-20" width="96" height="680"/>
    <!-- bench rail Y -48..0 -->
    <rect class="pc" x="144" y="122" width="96" height="146"/>
    <!-- bearing block Y -48..-12 -->
    <rect class="pc" x="144" y="268" width="72" height="96"/>
    <!-- slats -->
    <rect class="p" x="144" y="54" width="270" height="68"/>
    <!-- bolt through post + rail -->
    <g class="scr">
      <line x1="44" y1="196" x2="266" y2="196"/>
      <rect x="32" y="182" width="16" height="28" fill="#000"/>
      <rect x="240" y="180" width="8" height="32" fill="#000"/>
      <rect x="248" y="184" width="16" height="24" fill="#000"/>
    </g>
    <text class="sml" x="26" y="160" text-anchor="middle">hode</text>
    <text class="sml" x="286" y="192">skive + laasemutter</text>
    <text class="sml" x="286" y="216">M8 (innsiden)</text>
    <text class="sml" x="96" y="620" text-anchor="middle" transform="rotate(-90 96 620)">STOLPE 48 dyp</text>
    <text class="sml" x="192" y="240" text-anchor="middle">VANGE</text>
    <g class="ext"><line x1="48" y1="-20" x2="48" y2="-90"/><line x1="144" y1="-20" x2="144" y2="-90"/><line x1="240" y1="122" x2="240" y2="-90"/></g>
    <g class="dim"><line x1="48" y1="-70" x2="144" y2="-70"/><line x1="144" y1="-70" x2="240" y2="-70"/></g>
    <g class="dm" text-anchor="middle"><text x="96" y="-80">48</text><text x="192" y="-80">48</text></g>
    <text class="dm" x="144" y="-116" text-anchor="middle">hull 8,5 x 96 mm</text>
  </g>

  <!-- ============================================================ -->
  <g transform="translate(-100,930)">
    <rect x="0" y="0" width="2140" height="130" fill="none" stroke="#000" stroke-width="1.6"/>
    <text class="sml" x="16" y="34">LASTVEI BENK: person (1 kN) - benkespile 34x98 i boyning (sigma 10,72 MPa, utn. 0,73, nedboyning 3,14 mm) - trelagring pa benkevangen -</text>
    <text class="sml" x="16" y="64">benkevangen i boyning over 700 mm (utn. 0,14) - HALVPARTEN til stubbefoten (ren trelagring 8,1 kN) og HALVPARTEN til baerekloss J9-B (6,1 kN) - stolpe - gulv.</text>
    <text class="sml" x="16" y="102">M8-bolten i J9 baerer ingen vertikal last; den holder vangen inn mot stolpen. Uten baerekloss J9-B blir leddet et hengsel og benkeenden vipper.</text>
  </g>
</svg>
