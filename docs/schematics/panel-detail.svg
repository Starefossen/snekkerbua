<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 -280 2300 2050" width="1400">
  <title>Loftseng - platedetalj, seng- og bordmodus (panel detail)</title>
  <defs>
    <marker id="aE" markerWidth="14" markerHeight="10" refX="11" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 z" fill="#000"/></marker>
    <marker id="aS" markerWidth="14" markerHeight="10" refX="0" refY="4" orient="auto"><path d="M11,0 L0,4 L11,8 z" fill="#000"/></marker>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.1" fill="#000"/></pattern>
  </defs>
  <style>
    .p  { fill:#fff; stroke:#000; stroke-width:2.6; }
    .pc { fill:url(#grain); stroke:#000; stroke-width:2.6; }
    .pl { fill:#fff; stroke:#000; stroke-width:3.2; }
    .gho{ fill:none; stroke:#000; stroke-width:1.3; stroke-dasharray:3 5; }
    .dim{ fill:none; stroke:#000; stroke-width:1.1; }
    .ext{ fill:none; stroke:#000; stroke-width:0.8; }
    .steel{ fill:#000; stroke:none; }
    text{ font-family:Helvetica,Arial,sans-serif; font-size:22px; fill:#000; }
    .ttl{ font-size:38px; font-weight:bold; }
    .sub{ font-size:23px; }
    .pnl{ font-size:26px; font-weight:bold; }
    .sml{ font-size:19px; }
    .dm { font-size:21px; }
  </style>

  <text class="ttl" x="800" y="-190" text-anchor="middle">PLATEDETALJ - lose platen i begge hoyder</text>
  <text class="sub" x="800" y="-154" text-anchor="middle">Snitt Y-Z tatt ved X = 1000 (midt i apningen mellom benkene), skala 1,5:1. Malsettinger i virkelige mm.</text>

  <!-- ============================================================= -->
  <!-- PANEL A : Y-Z section, lx = 1.5*(Y+120), ly = 1.5*(600-Z)      -->
  <!-- ============================================================= -->
  <g transform="translate(60,40)">
    <text class="pnl" x="0" y="-90">A  SNITT (Y-Z) - begge moduser vist samtidig</text>

    <!-- floor -->
    <line x1="-40" y1="900" x2="1620" y2="900" stroke="#000" stroke-width="3.2"/>
    <text class="sml" x="1630" y="896">Z 0</text>

    <!-- posts: back Y -96..-48, front Y 858..906 -->
    <rect class="p" x="36"   y="-40" width="72" height="940"/>
    <rect class="p" x="1467" y="-40" width="72" height="940"/>
    <text class="sml" x="72"   y="820" text-anchor="middle" transform="rotate(-90 72 820)">BAKRE STOLPE</text>
    <text class="sml" x="1503" y="820" text-anchor="middle" transform="rotate(-90 1503 820)">FREMRE STOLPE</text>

    <!-- bench rails (continuous 1984) Y -48..0 and 810..858, Z 186..259 -->
    <rect class="pc" x="108"  y="511" width="72" height="110"/>
    <rect class="pc" x="1395" y="511" width="72" height="110"/>
    <text class="sml" x="144"  y="672" text-anchor="middle">BENKEVANGE</text>
    <text class="sml" x="144"  y="694" text-anchor="middle">48x73 x 1984</text>
    <text class="sml" x="1431" y="672" text-anchor="middle">BENKEVANGE</text>
    <text class="sml" x="1431" y="694" text-anchor="middle">48x73 x 1984</text>

    <!-- table ledgers Y -48..-27 and 837..858, Z 371..466 -->
    <rect class="pc" x="108"  y="201" width="32" height="142"/>
    <rect class="pc" x="1435" y="201" width="32" height="142"/>
    <line class="ext" x1="140" y1="272" x2="250" y2="392"/>
    <text class="sml" x="256" y="400">BORDBAERELEKT 21x95 x 1984, Z 371..466 (bak og front)</text>
    <line class="ext" x1="1467" y1="272" x2="1560" y2="300"/>
    <text class="sml" x="1568" y="294">fremre bordbaerelekt</text>

    <!-- ladder rung T=560, Y 858..931, Z 512..560 (alternative B target) -->
    <rect class="gho" x="1467" y="60" width="109" height="72"/>
    <text class="sml" x="1590" y="100">RUNG topp Z 560</text>
    <text class="sml" x="1590" y="122">(ikke brukt til platen)</text>

    <!-- ===== BED MODE : panel Y 30..858, Z 275..293 ===== -->
    <rect class="pl" x="225" y="460.5" width="1242" height="27"/>
    <text class="sml" x="846" y="452" text-anchor="middle">SENGEMODUS - PLATE 18 x 680 x 828 (Y 30..858), topp Z 293</text>
    <!-- rear hook over bench rail top (Z 259 -> ly 511) -->
    <path fill="none" stroke="#000" stroke-width="6" d="M 315 490.5 L 172.5 490.5 L 172.5 514.5 L 112.5 514.5"/>
    <!-- front hook over front bench rail -->
    <path fill="none" stroke="#000" stroke-width="6" d="M 1317 490.5 L 1407 490.5 L 1407 514.5 L 1467 514.5"/>
    <line class="ext" x1="142" y1="514" x2="330" y2="640"/>
    <text class="sml" x="336" y="652">KROKBESLAG med 16 mm nedsteg: leppa hviler paa</text>
    <text class="sml" x="336" y="674">benkevangens overkant Z 259 - platens underkant Z 275</text>

    <!-- ===== TABLE MODE : panel Z 485..503 ===== -->
    <rect class="pl" x="225" y="150" width="1242" height="27"/>
    <text class="sml" x="846" y="142" text-anchor="middle">BORDMODUS - samme plate, topp Z 500</text>
    <path fill="none" stroke="#000" stroke-width="6" d="M 315 180 L 172.5 180 L 172.5 204 L 112.5 204"/>
    <path fill="none" stroke="#000" stroke-width="6" d="M 1317 180 L 1407 180 L 1407 204 L 1467 204"/>
    <line class="ext" x1="142" y1="204" x2="330" y2="290"/>
    <text class="sml" x="336" y="302">Samme beslag paa bordbaerelektas overkant</text>
    <text class="sml" x="336" y="324">Z 466 - platens underkant Z 482, topp Z 500</text>

    <!-- stiffener battens under panel (optional) -->
    <rect class="gho" x="300" y="487.5" width="72" height="54"/>
    <rect class="gho" x="1290" y="487.5" width="72" height="54"/>
    <text class="sml" x="640" y="580">2 avstivningslekter 36x48 x 770 under platen (X 830 og 1160, Y 40..810)</text>

    <!-- Y dimension chain -->
    <g class="ext">
      <line x1="108"  y1="900" x2="108"  y2="1010"/>
      <line x1="225"  y1="519" x2="225"  y2="1010"/>
      <line x1="1467" y1="519" x2="1467" y2="1010"/>
      <line x1="1467" y1="900" x2="1467" y2="1010"/>
    </g>
    <g class="dim">
      <line x1="108" y1="990" x2="225"  y2="990" marker-start="url(#aS)" marker-end="url(#aE)"/>
      <line x1="225" y1="990" x2="1467" y2="990" marker-start="url(#aS)" marker-end="url(#aE)"/>
    </g>
    <g class="dm" text-anchor="middle">
      <text x="166"  y="1030">30</text>
      <text x="846"  y="980">828   (platens dybde, Y 30..858)</text>
      
    </g>

    <!-- Z leaders -->
    <g class="ext">
      <line x1="36" y1="150" x2="-60" y2="150"/>
      <line x1="36" y1="343" x2="-60" y2="343"/>
      <line x1="36" y1="460" x2="-60" y2="460"/>
      <line x1="36" y1="511" x2="-60" y2="511"/>
      <line x1="36" y1="621" x2="-60" y2="621"/>
    </g>
    <g class="dm" text-anchor="end">
      <text x="-70" y="156">Z 500  bordtopp</text>
      <text x="-70" y="349">Z 371</text>
      <text x="-70" y="466">Z 293  benketopp</text>
      <text x="-70" y="517">Z 259</text>
      <text x="-70" y="627">Z 186</text>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- PANEL B : bracket detail, 4:1                                  -->
  <!-- ============================================================= -->
  <g transform="translate(1180,1330)">
    <text class="pnl" x="-30" y="-140">B  KROKBESLAG - detalj 4:1</text>
    <!-- ledger 21 wide x 95 tall -> 84 x 380 at 4:1 ; show top 200 -->
    <rect class="pc" x="0" y="60" width="84" height="240"/>
    <text class="sml" x="42" y="330" text-anchor="middle">21x95 lekt</text>
    <!-- panel 18 thick -> 72 -->
    <rect class="p" x="150" y="-12" width="440" height="72"/>
    <text class="sml" x="370" y="30" text-anchor="middle">PLATE 18 mm</text>
    <!-- bracket: 4 mm steel -> 16 -->
    <path class="steel" d="M 150 60 L 150 76 L -12 76 L -12 44 L 4 44 L 4 60 Z"/>
    <!-- M6 bolt -->
    <g>
      <rect class="steel" x="228" y="-16" width="14" height="96"/>
      <rect class="steel" x="214" y="80" width="42" height="14"/>
      <rect class="steel" x="216" y="-22" width="38" height="10"/>
    </g>
    <line class="ext" x1="235" y1="94" x2="330" y2="180"/>
    <text class="sml" x="336" y="192">M6x30 senkhodeskrue + skive + laasemutter</text>
    <text class="sml" x="336" y="214">(2 per beslag, forsenket i platens overside)</text>
    <g class="ext"><line x1="-12" y1="44" x2="-12" y2="-70"/><line x1="150" y1="-12" x2="150" y2="-70"/></g>
    <g class="dim"><line x1="-12" y1="-56" x2="150" y2="-56" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
    <text class="dm" x="69" y="-70" text-anchor="middle">ca. 40 grep</text>
    <g class="ext"><line x1="84" y1="76" x2="84" y2="150"/><line x1="150" y1="76" x2="150" y2="150"/></g>
    <g class="dim"><line x1="84" y1="136" x2="150" y2="136" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
    <text class="dm" x="160" y="142">nedsteg 16 mm</text>
    <text class="sml" x="-12" y="380">Bendt flattstal 30 x 4 mm. Nedsteget 16 mm gir</text>
    <text class="sml" x="-12" y="402">platens underkant 16 mm over baerekanten.</text>
  </g>

  <!-- ============================================================= -->
  <g transform="translate(-240,1490)">
    <rect x="0" y="0" width="1000" height="150" fill="none" stroke="#000" stroke-width="1.6"/>
    <text class="sml" x="16" y="34">MERK:</text>
    <text class="sml" x="16" y="62">- Platen er 680 x 828 (Y 30..858). Dypere plate ville kollidere med stigevangene i Y 858..906, som staar</text>
    <text class="sml" x="16" y="86">  midt i platens X-omraade (655..1335).</text>
    <text class="sml" x="16" y="114">- 3D-modellen viser bordbaerelekta med overkant Z 482 fordi krokbeslagene ikke er modellert der.</text>
    <text class="sml" x="16" y="138">  BYGG lekta 16 mm lavere, overkant Z 466, ellers blir bordet 516 mm hoyt i stedet for 500.</text>
  </g>
</svg>
