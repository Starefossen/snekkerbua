<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -240 1620 1290" width="1300">
  <title>Loftseng - stigedetalj (ladder detail)</title>
  <defs>
    <marker id="aE" markerWidth="14" markerHeight="10" refX="11" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 z" fill="#000"/></marker>
    <marker id="aS" markerWidth="14" markerHeight="10" refX="0" refY="4" orient="auto"><path d="M11,0 L0,4 L11,8 z" fill="#000"/></marker>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.1" fill="#000"/></pattern>
  </defs>
  <style>
    .p  { fill:#fff; stroke:#000; stroke-width:2.4; }
    .pc { fill:url(#grain); stroke:#000; stroke-width:2.4; }
    .hid{ fill:none; stroke:#000; stroke-width:1.2; stroke-dasharray:9 6; }
    .dim{ fill:none; stroke:#000; stroke-width:1.1; }
    .ext{ fill:none; stroke:#000; stroke-width:0.8; }
    .scr{ fill:none; stroke:#000; stroke-width:2.2; }
    text{ font-family:Helvetica,Arial,sans-serif; font-size:22px; fill:#000; }
    .ttl{ font-size:38px; font-weight:bold; }
    .sub{ font-size:23px; }
    .pnl{ font-size:26px; font-weight:bold; }
    .sml{ font-size:19px; }
    .dm { font-size:21px; }
  </style>

  <text class="ttl" x="700" y="-160" text-anchor="middle">STIGEDETALJ - vange, rungetrinn og stigekloss</text>
  <text class="sub" x="700" y="-124" text-anchor="middle">Vist ved trinn 2 (topp Z 560). Identisk for Z 280, 840 og 1120. Alle mal i mm.</text>

  <!-- ================================================================= -->
  <!-- PANEL A : FRONT VIEW  (lx = X-660, ly = 640-Z)                     -->
  <!-- ================================================================= -->
  <g transform="translate(60,40)">
    <text class="pnl" x="0" y="-96">A  OPPRISS FORFRA (X-Z)</text>

    <!-- uprights -->
    <rect class="p" x="52"  y="0" width="73" height="280"/>
    <rect class="p" x="545" y="0" width="73" height="280"/>
    <text class="sml" x="88"  y="200" text-anchor="middle" transform="rotate(-90 88 200)">STIGEVANGE 48x73</text>
    <text class="sml" x="581" y="200" text-anchor="middle" transform="rotate(-90 581 200)">STIGEVANGE 48x73</text>

    <!-- rung -->
    <rect class="p" x="125" y="80" width="420" height="48"/>
    <text class="sml" x="335" y="102" text-anchor="middle">RUNGETRINN 48x73 x 420  (Z 512..560)</text>

    <!-- cleat blocks -->
    <rect class="pc" x="125" y="128" width="36" height="48"/>
    <rect class="pc" x="509" y="128" width="36" height="48"/>

    <!-- block screws (2x 5x70, superimposed in this view) -->
    <g class="scr">
      <line x1="161" y1="152" x2="91" y2="152"/>
      <line x1="161" y1="146" x2="161" y2="158"/>
      <line x1="509" y1="152" x2="579" y2="152"/>
      <line x1="509" y1="146" x2="509" y2="158"/>
    </g>
    <!-- J7 screw through upright into rung end grain -->
    <g class="scr">
      <line x1="52" y1="104" x2="172" y2="104"/>
      <line x1="52" y1="98"  x2="52"  y2="110"/>
      <line x1="618" y1="104" x2="498" y2="104"/>
      <line x1="618" y1="98"  x2="618" y2="110"/>
    </g>

    <!-- callouts -->
    <line class="ext" x1="143" y1="176" x2="90" y2="352"/>
    <text class="sml" x="-10" y="374">J6: STIGEKLOSS 36x48, L=73</text>
    <text class="sml" x="-10" y="398">2x treskrue 5x70 i Z = topp-72,</text>
    <text class="sml" x="-10" y="422">ved Y 870 og Y 894 (se snitt B)</text>
    <line class="ext" x1="120" y1="104" x2="300" y2="330"/>
    <text class="sml" x="306" y="352">J7: 1x treskrue 6x120 utenfra gjennom</text>
    <text class="sml" x="306" y="376">vangen (73) inn i rungens endeved (47),</text>
    <text class="sml" x="306" y="400">Z = topp-24. Baerer ingen last.</text>

    <!-- dims -->
    <g class="ext">
      <line x1="52"  y1="0"  x2="52"  y2="-60"/>
      <line x1="125" y1="0"  x2="125" y2="-60"/>
      <line x1="545" y1="0"  x2="545" y2="-60"/>
      <line x1="618" y1="0"  x2="618" y2="-60"/>
    </g>
    <g class="dim">
      <line x1="52"  y1="-40" x2="125" y2="-40"/>
      <line x1="125" y1="-40" x2="545" y2="-40" marker-start="url(#aS)" marker-end="url(#aE)"/>
      <line x1="545" y1="-40" x2="618" y2="-40"/>
    </g>
    <g class="dm" text-anchor="middle">
      <text x="88"  y="-50">73</text>
      <text x="335" y="-50">420  (fritt spenn)</text>
      <text x="581" y="-50">73</text>
    </g>
    <g class="ext">
      <line x1="545" y1="80"  x2="700" y2="80"/>
      <line x1="545" y1="128" x2="700" y2="128"/>
      <line x1="545" y1="176" x2="700" y2="176"/>
    </g>
    <g class="dim">
      <line x1="670" y1="80"  x2="670" y2="128" marker-start="url(#aS)" marker-end="url(#aE)"/>
      <line x1="670" y1="128" x2="670" y2="176" marker-start="url(#aS)" marker-end="url(#aE)"/>
    </g>
    <g class="dm">
      <text x="712" y="76">Z 560  trinntopp</text>
      <text x="712" y="112">48  (trinntykkelse)</text>
      <text x="712" y="134">Z 512</text>
      <text x="712" y="168">48  (klosshoyde)</text>
      <text x="712" y="190">Z 464</text>
    </g>
    <g class="ext"><line x1="125" y1="176" x2="125" y2="220"/><line x1="161" y1="176" x2="161" y2="220"/></g>
    <g class="dim"><line x1="125" y1="210" x2="161" y2="210" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
    <text class="dm" x="143" y="240" text-anchor="middle">36</text>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B : HORIZONTAL SECTION at Z = topp-72  (lx = X-660, ly=Y-840)-->
  <!-- ================================================================= -->
  <g transform="translate(60,560)">
    <text class="pnl" x="0" y="-106">B  VANNRETT SNITT i Z = topp-72 (X-Y), sett ovenfra</text>

    <!-- rung outline above the cut -->
    <rect class="hid" x="125" y="18" width="420" height="73"/>
    <!-- uprights -->
    <rect class="pc" x="52"  y="18" width="73" height="48"/>
    <rect class="pc" x="545" y="18" width="73" height="48"/>
    <!-- blocks -->
    <rect class="pc" x="125" y="18" width="36" height="73"/>
    <rect class="pc" x="509" y="18" width="36" height="73"/>
    <!-- screws -->
    <g class="scr">
      <line x1="161" y1="30" x2="91" y2="30"/><line x1="161" y1="24" x2="161" y2="36"/>
      <line x1="161" y1="54" x2="91" y2="54"/><line x1="161" y1="48" x2="161" y2="60"/>
      <line x1="509" y1="30" x2="579" y2="30"/><line x1="509" y1="24" x2="509" y2="36"/>
      <line x1="509" y1="54" x2="579" y2="54"/><line x1="509" y1="48" x2="509" y2="60"/>
    </g>
    <!-- labels -->
    <text class="sml" x="335" y="130" text-anchor="middle">Rungens omriss over snittplanet (Y 858..931)</text>
    <g class="ext">
      <line x1="52"  y1="18" x2="52"  y2="-70"/>
      <line x1="125" y1="18" x2="125" y2="-70"/>
      <line x1="161" y1="18" x2="161" y2="-70"/>
    </g>
    <g class="dim">
      <line x1="52" y1="-50" x2="125" y2="-50"/>
      <line x1="125" y1="-50" x2="161" y2="-50"/>
    </g>
    <g class="dm" text-anchor="middle"><text x="88" y="-60">73</text><text x="200" y="-60">36 kloss</text></g>
    <g class="ext">
      <line x1="620" y1="18" x2="700" y2="18"/><line x1="700" y1="18" x2="770" y2="-42"/>
      <line x1="620" y1="30" x2="700" y2="30"/><line x1="700" y1="30" x2="770" y2="6"/>
      <line x1="620" y1="54" x2="700" y2="54"/><line x1="700" y1="54" x2="770" y2="54"/>
      <line x1="620" y1="66" x2="700" y2="66"/><line x1="700" y1="66" x2="770" y2="102"/>
      <line x1="620" y1="91" x2="700" y2="91"/><line x1="700" y1="91" x2="770" y2="150"/>
    </g>
    <g class="dm">
      <text x="782" y="-34">Y 858  vangens bakkant</text>
      <text x="782" y="14">Y 870  skrue 1</text>
      <text x="782" y="62">Y 894  skrue 2</text>
      <text x="782" y="110">Y 906  vangens forkant</text>
      <text x="782" y="158">Y 931  rung og kloss stikker 25 forbi</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL C : SIDE SECTION (lx = Y-840, ly = 640-Z)                    -->
  <!-- ================================================================= -->
  <g transform="translate(1180,40)">
    <text class="pnl" x="-30" y="-14">C  SNITT (Y-Z)</text>
    <rect class="p"  x="18" y="0"   width="48" height="280"/>
    <rect class="p"  x="18" y="80"  width="73" height="48"/>
    <rect class="pc" x="18" y="128" width="73" height="48"/>
    <g class="scr">
      <circle cx="30" cy="152" r="5" fill="#000"/>
      <circle cx="54" cy="152" r="5" fill="#000"/>
      <circle cx="42" cy="104" r="5" fill="#000"/>
    </g>
    <text class="sml" x="105" y="96">RUNG</text>
    <text class="sml" x="105" y="152">KLOSS</text>
    <text class="sml" x="42" y="255" text-anchor="middle" transform="rotate(-90 42 255)">VANGE 48 dyp</text>
    <g class="ext"><line x1="66" y1="128" x2="66" y2="330"/><line x1="91" y1="128" x2="91" y2="330"/></g>
    <g class="dim"><line x1="66" y1="316" x2="91" y2="316" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
    <text class="dm" x="110" y="322">25 utstikk</text>
    <g class="ext"><line x1="18" y1="128" x2="-70" y2="128"/><line x1="18" y1="176" x2="-70" y2="176"/></g>
    <g class="dim"><line x1="-56" y1="128" x2="-56" y2="176" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
    <text class="dm" x="-64" y="158" text-anchor="end">48</text>
  </g>

  <!-- ================================================================= -->
  <g transform="translate(-60,870)">
    <rect x="0" y="0" width="1580" height="150" fill="none" stroke="#000" stroke-width="1.6"/>
    <text class="sml" x="16" y="34">LASTVEI TRINN: fot (1 kN) - rungetrinn i boyning (sigma 3,75 MPa, utn. 0,23, nedboyning 0,21 mm) - trelagring 36x73 pa klossen (6,1 kN kapasitet)</text>
    <text class="sml" x="16" y="64">- 2 treskruer 5x70 i skjaer per kloss (3,0 kN kapasitet mot 0,5 kN last) - stigevangen som soyle rett ned til gulvet (ingen festemiddel i lastveien).</text>
    <text class="sml" x="16" y="100">TRINNHOYDER (topp): Z 280 / 560 / 840 / 1120. Klossene ligger Z topp-96 .. topp-48. Mal hver klosshoyde fra GULVET, ikke fra forrige kloss.</text>
    <text class="sml" x="16" y="130">Forbor 3,5 mm gjennom klossen og 4,5 mm gjennom vangen for 6x120-skruen. J10b: 1 vinkelbeslag 90x90 fra hver stigevange til den gjennomgaende benkevangen (Z 186..259).</text>
  </g>
</svg>
